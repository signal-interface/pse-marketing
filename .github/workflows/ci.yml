name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
        env:
          CHAP_WIDGET_ENABLED: "false"
          PRODUCT_TOUR_ENABLED: "false"
          ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
          POSTGRES_URL: "postgres://ci:ci@localhost:5432/ci"
          RESEND_API_KEY: "re_ci_placeholder"
          INTERNAL_BASIC_AUTH_USER: "ci"
          INTERNAL_BASIC_AUTH_PASSWORD: "ci"
