name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit + contract tests
        run: npx vitest run

      - name: Boundary lint
        run: bash scripts/boundary-lint.sh

      - name: Production build
        run: npm run build
        env:
          # Inert nonproduction placeholders for module initialization only.
          CHAP_WIDGET_ENABLED: "false"
          PRODUCT_TOUR_ENABLED: "false"
          ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
          POSTGRES_URL: "postgres://ci:ci@localhost:5432/ci"
          RESEND_API_KEY: "re_ci_placeholder"
          INTERNAL_BASIC_AUTH_USER: "ci"
          INTERNAL_BASIC_AUTH_PASSWORD: "ci"
