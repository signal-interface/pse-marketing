name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit + contract tests
        run: npx vitest run

      - name: Boundary lint (grep backstop)
        run: bash scripts/boundary-lint.sh

      - name: Production build
        run: npm run build
        env:
          CHAP_WIDGET_ENABLED: "false"
          PRODUCT_TOUR_ENABLED: "false"
